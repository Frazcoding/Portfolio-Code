[project]
name = "ember-hub-simulator"
version = "0.1.0"
description = "Ember Bristol-London coach charging hub: operations, cost and site layout simulator (Sim Workbench project)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fraser McLellan" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.8",
    "typst>=0.12",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.12"]

[project.scripts]
ember-hub-simulator = "ember_hub_simulator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ember_hub_simulator", "src/simcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["notebook: executes a notebook end to end", "slow: swept-path simulation (several seconds)"]
filterwarnings = [
    "error::simcore.core.equation.RangeWarning",
    "ignore:Using .httpx. with:Warning",
    "ignore:Proactor event loop:RuntimeWarning",
]

[tool.jupytext]
formats = "ipynb,py:percent"
